px;background:none;border:0;font-size:14px;color:var(--muted);border-radius:4px}.theme button[aria-pressed=true]{background:var(--raised);color:var(--text)}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.top{height:80px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 40px;gap:24px}.top-right{display:flex;align-items:center;gap:20px}.avatar{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;color:var(--text)}main{padding:40px;max-width:1520px;margin:0 auto}.page-head{display:flex;justify-content:space-between;gap:24px;align-items:center;margin-bottom:32px}.page-head p{margin-top:10px;color:var(--muted)}.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;min-height:48px;padding:10px 20px;font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;white-space:nowrap}.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}.btn.link{background:none;padding:6px 0;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:5px}.btn.small{min-height:44px;padding:8px 14px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:24px}.stack{display:flex;flex-direction:column;gap:24px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.tag{font-size:14px;padding:4px 10px;border:1px solid var(--line);border-radius:4px;white-space:nowrap;color:var(--body)}.site-title{display:flex;gap:16px;align-items:center}.site-icon{width:48px;height:48px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;color:var(--text)}.site-domain{font-size:24px;font-weight:600;color:var(--text);overflow-wrap:anywhere}.detail{display:flex;gap:20px;flex-wrap:wrap;padding:24px 0;border-bottom:1px solid var(--line);margin-bottom:24px}.detail span{display:flex;align-items:center;gap:8px}.dot{width:6px;height:6px;background:var(--muted);display:inline-block;border-radius:50%}.site-action{display:flex;justify-content:space-between;align-items:center;gap:20px}.site-action p{max-width:510px;color:var(--muted)}.row{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0;padding-bottom:0}.row:first-child{padding-top:0}.row-title{font-size:18px;color:var(--text);font-weight:500}.row p{margin-top:4px;color:var(--muted)}.credit-num{font-size:40px;line-height:1.2;color:var(--text);margin:16px 0 24px;font-weight:600}.credit-num small{font-size:16px;font-weight:400}.kv{display:flex;justify-content:space-between;padding:10px 0;gap:16px}.kv+.kv{border-top:1px solid var(--line)}.process{margin-top:32px;padding-top:28px;border-top:1px solid var(--line)}.steps{display:grid;grid-template-columns:repeat(4,1fr);margin-top:24px;gap:24px}.step-num{width:28px;height:28px;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;margin-bottom:12px;font-size:14px}.steps b{display:block;color:var(--text);font-size:18px;font-weight:500}.steps p{margin-top:6px;color:var(--muted);font-size:16px}.note{display:flex;gap:12px;align-items:flex-start;color:var(--muted);margin-top:24px}.note svg{flex:none;margin-top:3px}.banner{border:1px solid var(--line);border-left:3px solid var(--blue);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:24px;background:var(--surface)}.banner.danger{border-left-color:var(--danger)}.banner b{color:var(--text);display:block;margin-bottom:4px}.review{margin-top:40px;border-top:1px solid var(--line);padding-top:20px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}.review label{font-size:14px;color:var(--muted)}select,input{border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--text);padding:10px 12px;min-height:44px}label.field{display:flex;flex-direction:column;gap:8px;font-size:16px}.form{display:grid;gap:24px;margin-top:28px;max-width:780px}.check{display:flex;gap:12px;align-items:flex-start}.check input{min-height:auto;width:20px;height:20px;margin-top:4px;flex:none}.check label{color:var(--body)}.inline-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.empty{padding:40px 0 24px;max-width:800px}.empty p{margin-top:16px;color:var(--muted)}.flow-list{display:grid;gap:0;margin-top:28px}.flow-row{display:grid;grid-template-columns:40px 200px 1fr;gap:24px;padding:24px 0;border-bottom:1px solid var(--line)}.flow-row b{color:var(--text);font-size:18px}.flow-row p{color:var(--muted)}.flow-row .step-num{margin:0}.notice{padding:16px 20px;border:1px solid var(--line);background:var(--raised);border-radius:4px;color:var(--body)}.notice p{margin-top:6px}.footer{margin-top:28px;display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:14px}dialog{max-width:620px;width:calc(100% - 40px);background:var(--surface);color:var(--body);border:1px solid var(--line);border-radius:8px;padding:32px}dialog::backdrop{background:#0009}dialog p{margin-top:16px}.status-line{font-size:14px;color:var(--muted);margin-bottom:12px}.table-row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:24px;padding:20px 0;border-bottom:1px solid var(--line)}.table-row strong{font-weight:500;color:var(--text)}.no-wrap{white-space:nowrap}

@media(max-width:1200px){.app{grid-template-columns:220px 1fr}.grid{grid-template-columns:1fr}.stack{gap:20px}.steps{grid-template-columns:repeat(2,1fr)}main{padding:28px}.top{padding:0 28px}.top-right>.meta{display:none}}
@media(max-width:760px){.app{display:block}.sidebar{position:static;height:auto;padding:20px;gap:16px}.org,.sidebar-bottom>.meta{display:none}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap}.nav svg{display:none}.sidebar-bottom{margin:0;max-width:240px}.top{height:auto;padding:16px 20px}.top-right{display:none}main{padding:24px 20px}.page-head,.site-action,.banner{align-items:flex-start;flex-direction:column}h1{font-size:28px}.panel{padding:22px}.site-domain{font-size:20px}.steps{grid-template-columns:1fr}.flow-row{grid-template-columns:32px 1fr;gap:12px}.flow-row p{grid-column:2}.table-row{grid-template-columns:1fr}.footer{flex-direction:column}}

<div class="app">

<nav class="nav" id="nav"></nav>
<div class="sidebar-bottom"><div class="theme" role="group" aria-label="화면 테마"><button type="button" data-theme-value="light" aria-pressed="false" id="light"></button><button type="button" data-theme-value="night" aria-pressed="true" id="night"></button></div><p class="meta">고객 1인 · 사이트 1개<br>지원 환경 안에서 안전하게 수정합니다.</p></div>

<div><header class="top"><span id="breadcrumb">내 작업 공간</span><div class="top-right"><span class="meta">사용 가능 <b>98C</b> · 예약 <b>2C</b></span><span class="tag">시연 데이터</span><span class="avatar" aria-label="김 사용자">김</span></div></header><main id="content" tabindex="-1"></main></div>

<script>
const icons={home:'<path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/>',link:'<path d="m10 13 4-4M8 16l-1 1a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m0 12a4 4 0 0 0 6 0l5-5a4 4 0 0 0-6-6l-1 1"/>',jobs:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',history:'<path d="M3 11a9 9 0 1 1 2 7M3 5v6h6m3-5v6l4 2"/>',credit:'<circle cx="12" cy="12" r="9"/><path d="M15 8a5 5 0 1 0 0 8"/>',support:'<path d="M4 17H3V5h18v12H10l-6 4Z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M9 3h6l1 4 4 1v8l-4 1-1 4H9l-1-4-4-1V8l4-1Z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M19 5l-1.5 1.5m-11 11L5 19"/>',moon:'<path d="M20 14A9 9 0 0 1 10 3a9 9 0 1 0 10 11Z"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',shield:'<path d="m12 2 8 3v7c0 5-8 10-8 10S4 17 4 12V5Z"/><path d="m8 12 3 3 5-6"/>',monitor:'<rect x="3" y="3" width="18" height="13" rx="2"/><path d="M8 21h8m-4-5v5"/>',check:'<path d="m5 12 4 4L19 6"/>'};
const svg=n=>`<svg aria-hidden="true" viewBox="0 0 24 24">${icons[n]||icons.jobs}</svg>`;
const menus=[['home','홈','home'],['connection','연결 관리','link'],['jobs','작업','jobs'],['deployments','반영과 복원','history'],['credits','크레딧','credit'],['support','문의','support'],['settings','설정','settings']];
const stateOptions={ready:'연결 완료',empty:'첫 방문 · 사이트 없음',connecting:'연결 중 · 이어서 진행',passkey:'패스키 등록 필요',unknown:'반영 결과 확인 중',failed:'검증 실패',stale:'원본 변경 · 재검증 필요'};
let view='home',sample=new URLSearchParams(location.search).get('state')||'ready',connectStep=0,approved=false,previewed=false,requestConfirmed=false,hasPasskey=false;
if(!stateOptions[sample])sample='ready';
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,primary=false)=>`<button class="btn ${primary?'primary':''}" data-action="${action}">${label}${primary?svg('arrow'):''}</button>`;
function theme(value){document.documentElement.dataset.theme=value;try{localStorage.setItem('livepatch-c01-theme',value)}catch{}document.querySelectorAll('[data-theme-value]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.themeValue===value))}
$('#light').innerHTML=svg('sun')+'라이트';$('#night').innerHTML=svg('moon')+'나이트';try{theme(localStorage.getItem('livepatch-c01-theme')||'night')}catch{theme('night')}
function head(title,desc,action=''){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function steps(){return `<section class="process"><h2>수정은 이렇게 진행됩니다</h2><div class="steps">${[['선택하고 요청하기','사이트에서 바꿀 요소 하나를 고르고 말하거나 입력합니다.'],['변경안 확인하기','변경 내용과 최대 비용을 확인한 뒤 미리보기를 만듭니다.'],['확인하고 반영하기','자동 검사를 통과하면 패스키로 승인합니다.'],['결과 확인과 복원','사후 점검 결과를 확인하고 필요하면 복원을 요청합니다.']].map((s,i)=>`<div><span class="step-num">${i+1}</span><b>${s[0]}</b><p>${s[1]}</p></div>`).join('')}</div><button class="btn link" data-action="flow">전체 흐름과 예외 상황 보기</button></section>`}
function review(){return `<div class="review"><label for="sample">검토용 화면 상태</label><select id="sample">${Object.entries(stateOptions).map(([k,v])=>`<option value="${k}" ${k===sample?'selected':''}>${v}</option>`).join('')}</select><span class="meta">화면과 전환을 확인하는 시연입니다. 실제 연결·인증·반영은 실행하지 않습니다.</span></div><footer class="footer"><span>C01 · 사용자 홈 · 2026.10.19</span><span>PC 본문 16px · Pretendard · 라이트 / 나이트</span></footer>`}
function banner(){const d={passkey:['첫 반영 전에 패스키를 등록해 주세요.','지문·얼굴 인식 등으로 본인을 확인합니다. 등록 전에도 변경안을 검토할 수 있습니다.','패스키 설정','settings'],unknown:['반영 결과를 확인하고 있습니다.','성공 여부가 확인될 때까지 다시 반영하지 않습니다. 예약 2C는 확인이 끝날 때까지 유지됩니다.','현재 상태 확인','deployments'],failed:['미리보기 검사에서 확인할 항목이 있습니다.','운영 사이트는 바뀌지 않았습니다. 실패한 항목을 확인하고 요청을 수정해 주세요.','검사 결과 보기','jobs'],stale:['원본 사이트가 변경됐습니다.','이전 변경안의 승인은 사용할 수 없습니다. 최신 원본으로 다시 검증해 주세요.','다시 검증하기','jobs']};if(!d[sample])return '';const s=d[sample];return `<div class="banner ${sample==='failed'?'danger':''}" role="status"><div><b>${s[0]}</b><p>${s[1]}</p></div>${btn(s[2],s[3])}</div>`}
function home(){let empty=sample==='empty'||sample==='connecting';return head('무엇을 바꿀까요?','내 사이트의 상태를 확인하고, 이어서 작업하세요.')+banner()+`<div class="grid"><div class="stack"><section class="panel"><div class="panel-head"><h2>내 사이트</h2><span class="tag">${empty?'연결 전':'연결 완료'}</span></div>${empty?`<div class="empty"><h3>${sample==='connecting'?'사이트 연결을 이어서 완료하세요.':'먼저 내 사이트를 연결해 주세요.'}</h3><p>현재는 지원되는 GitHub 정적 HTML/CSS 사이트 1개를 연결할 수 있습니다. 연결 진단과 테스트 수정·복원 확인이 끝나면 Studio를 열 수 있습니다.</p><div class="inline-actions">${btn(sample==='connecting'?'연결 이어서 하기':'사이트 연결하기','connection',true)}</div></div>`:`<div class="site-title"><span class="site-icon">${svg('monitor')}</span><div><div class="site-domain">blue-dental.example</div><span class="meta">블루치과의원 · 시연 사이트</span></div></div><div class="detail"><span><i class="dot"></i>연결 정상</span><span>문구 · 기존 이미지 · 허용 스타일</span><span class="meta">마지막 진단 · 오늘 10:30</span></div><div class="site-action"><p>${sample==='unknown'?'현재 반영 결과를 확인한 뒤 새 작업을 시작할 수 있습니다.':'바꿀 곳을 먼저 고른 뒤 말하거나 입력해 주세요. 승인하기 전에는 운영 사이트가 바뀌지 않습니다.'}</p>${btn(sample==='unknown'?'반영 상태 확인':'Studio 열기',sample==='unknown'?'deployments':'studio',true)}</div>`}</section><section class="panel"><div class="panel-head"><h2>이어서 할 작업</h2><button class="btn link" data-action="jobs">작업 보기</button></div>${empty?'<p class="muted">아직 작업이 없습니다. 사이트 연결을 마치면 시작할 수 있습니다.</p>':`<div class="row"><div><span class="tag">${sample==='unknown'?'결과 확인 중':sample==='failed'?'검증 실패':sample==='stale'?'재검증 필요':'변경안 준비'}</span><p class="row-title">메인 배너 제목 변경</p><p>최대 2C 예약 · 운영 반영 전 최종 확인</p></div>${btn(sample==='unknown'?'상태 확인':'변경안 검토',sample==='unknown'?'deployments':'jobs')}</div>`}</section><section class="panel"><div class="panel-head"><h2>최근 반영</h2><button class="btn link" data-action="deployments">반영과 복원 보기</button></div>${empty?'<p class="muted">확인된 반영 내역이 없습니다.</p>':`<div class="row"><div><div class="row-title">진료시간 안내 문구 수정</div><p>반영 확인 완료 · 사후 점검 정상</p></div><span class="meta no-wrap">어제 15:20</span></div>`}</section></div><aside class="stack"><section class="panel"><h2>사용 가능한 크레딧</h2><div class="credit-num">${empty?'100':'98'}<small> C</small></div><div class="kv"><span>작업 예약</span><b>${empty?'0':'2'}C</b></div><p class="meta" style="margin:12px 0 16px">예약은 확정 차감이 아닙니다. 운영 반영과 사후 확인이 끝나면 견적 이하로 차감합니다.</p><button class="btn link" data-action="credits">거래 내역 확인</button></section><section class="panel"><h3>안전하게 시작하기</h3><p style="margin-top:12px">패스키 등록부터 연결 문제까지, 필요한 도움을 확인하세요.</p><div class="inline-actions">${btn('보안 설정','settings')}${btn('문의하기','support')}</div></section><div class="note">${svg('shield')}<p>한 번에 요소 하나를 수정합니다. 복원은 마지막 성공 배포 1건에 대해 가능 여부를 확인한 뒤 진행합니다.</p></div></aside></div>`+steps()}
const connectionStages=[['지원 환경 확인','GitHub의 정적 HTML/CSS 템플릿과 지원되는 배포 파이프라인만 연결합니다. CMS·SFTP·다른 프레임워크 연결은 현재 제공하지 않습니다.'],['GitHub 연결','사이트 소유·관리 권한을 확인한 뒤 저장소와 브랜치를 연결합니다.'],['연결 진단','접근 권한, 원본 매핑, 배포 파이프라인과 복원 가능 여부를 확인합니다.'],['테스트 수정과 복원','승인된 테스트 환경에서 시험 변경과 원상 복원을 모두 확인합니다.'],['연결 완료','사이트 진단과 테스트 복원 확인을 마쳤습니다. 이제 Studio에서 변경안을 만들 수 있습니다.']];
function connection(){let [title,desc]=connectionStages[connectStep];return head('사이트 연결','지원 환경 확인부터 테스트 복원까지 순서대로 진행합니다.')+`<section class="panel"><p class="status-line">${connectStep+1} / 5 단계 · 시연</p><h2>${title}</h2><p style="margin-top:16px;max-width:850px">${desc}</p>${connectStep===0?`<div class="form"><label class="field">운영 사이트 주소<input id="site-url" type="url" placeholder="https://내사이트주소" value="https://blue-dental.example" required></label><div class="check"><input type="checkbox" id="ownership"><label for="ownership">이 사이트를 소유하거나 연결·수정할 관리 권한이 있습니다.</label></div></div>`:connectStep===1?`<div class="form"><div class="notice">연결 방식: GitHub · 읽기와 쓰기 권한은 선택한 저장소로 제한합니다.<p class="meta">실제 OAuth 연결이 아닌 단계 검토용 화면입니다.</p></div><label class="field">저장소<input value="blue-dental / website-demo" readonly></label><label class="field">대상 브랜치<input value="main · 보호 규칙 확인 대상" readonly></label></div>`:connectStep===2?`<div class="form">${['선택 저장소 접근 권한','정적 템플릿·배포 파이프라인','원본 매핑 HIGH','복원 스냅샷과 보존 조건'].map(t=>`<div class="kv"><span>${t}</span><span>확인됨 · 시연</span></div>`).join('')}<div class="notice">어느 항목이든 실패하면 Studio의 운영 반영을 허용하지 않습니다.</div></div>`:connectStep===3?`<div class="form"><div class="notice">운영 사이트가 아닌 승인된 테스트 환경에서 진행합니다. 시연에서는 실제 파일을 수정하지 않습니다.</div><div class="kv"><span>테스트 수정</span><span>확인 완료 · 시연</span></div><div class="kv"><span>테스트 변경 복원</span><span>원상 복원 확인 · 시연</span></div></div>`:`<div class="note">${svg('check')}<p>연결 상태: 정상 · 원본 매핑 HIGH · 테스트 복원 확인</p></div>`}<div class="inline-actions">${connectStep?btn('이전 단계','connect-back'):btn('홈으로','home')}${btn(connectStep===4?'Studio 열기':connectStep===0?'지원 환경 확인하고 계속':connectStep===1?'연결 진단하기':connectStep===2?'테스트 수정·복원 확인하기':'사이트 연결 완료',connectStep===4?'studio':'connect-next',true)}</div><p id="form-error" role="alert" style="color:var(--danger);margin-top:16px"></p></section>`}
function jobs(){return head('작업','목록과 상세를 한 화면에서 확인하고, 같은 작업을 이어서 진행합니다.')+`<section class="panel"><span class="tag">${sample==='failed'?'검증 실패':sample==='stale'?'원본 변경 · 재검증 필요':sample==='unknown'?'결과 확인 중':'변경안 검토'}</span><h2 style="margin-top:20px">메인 배너 제목 변경</h2><p class="meta" style="margin-top:8px">작업 DEMO-001 · blue-dental.example · 시연 데이터</p><div class="form"><div class="notice"><b>변경 전</b><p>가을 스케일링 이벤트</p></div><div class="notice"><b>변경 후</b><p>10월 스케일링 안내</p></div><div class="kv"><span>예상 최대 비용</span><b>2C · 예약 중</b></div><div class="kv"><span>검증 상태</span><b>${sample==='failed'?'텍스트 줄바꿈 검사 실패':sample==='stale'?'원본 해시 변경 감지':'자동 검사 통과 · 시연'}</b></div><p class="muted">${sample==='unknown'?'반영 결과가 불명인 동안 재반영은 막고 기존 작업의 상태를 확인합니다.':sample==='failed'||sample==='stale'?'최신 원본으로 변경안을 다시 만들고 검증한 뒤 승인해야 합니다.':'이 작업은 아직 운영에 반영되지 않았습니다. Studio에서 변경안과 최대 비용을 확인한 뒤 본인이 승인합니다.'}</p></div><div class="inline-actions">${btn(sample==='unknown'?'반영 상태 확인':sample==='failed'||sample==='stale'?'요청 수정·재검증':'Studio에서 검토',sample==='unknown'?'deployments':'studio',true)}${btn('이 작업 문의하기','support')}</div></section>`}
function deployments(){const unknown=sample==='unknown';return head('반영과 복원','반영 결과와 사후 점검을 구분해서 확인합니다.')+`<section class="panel"><span class="tag">${unknown?'반영 결과 확인 중':'반영 확인 완료'}</span><h2 style="margin-top:20px">${unknown?'메인 배너 제목 변경':'진료시간 안내 문구 수정'}</h2><div class="form"><div class="kv"><span>운영 반영</span><b>${unknown?'확인 중':'확인됨'}</b></div><div class="kv"><span>사후 점검</span><b>${unknown?'반영 확인 후 진행':'정상'}</b></div><div class="kv"><span>크레딧</span><b>${unknown?'2C 예약 유지':'1C 차감 확정 · 시연'}</b></div><div class="notice">${unknown?'결과가 확인되지 않아 새 반영과 복원을 잠시 막았습니다. 기존 작업 번호로 상태를 다시 조회합니다. 중복 요청하지 않습니다.':'복원 대상은 마지막 성공 배포 1건입니다. 보존 기간·현재 원본·스냅샷·후속 변경을 확인한 뒤 진행합니다. 복원 자체의 추가 차감은 없습니다.'}</div></div><div class="inline-actions">${btn(unknown?'기존 작업 상태 다시 조회':'복원 가능 여부 확인',unknown?'reconcile':'rollback',true)}${btn('이 반영 문의하기','support')}</div></section>`}
function credits(){return head('크레딧','사용 가능·예약·확정 차감·반환을 구분해서 확인합니다.')+`<section class="panel"><div class="credit-num">98<small> C 사용 가능 · 2C 예약</small></div><div class="table-row meta"><span>거래</span><span>수량·상태</span><span>관련 작업</span></div><div class="table-row"><strong>미리보기 요청</strong><span>2C 예약</span><button class="btn link" data-action="jobs">DEMO-001 보기</button></div><div class="table-row"><strong>진료시간 문구 반영</strong><span>1C 차감 확정</span><button class="btn link" data-action="deployments">반영 내역 보기</button></div><div class="note">${svg('shield')}<p>미리보기 요청 시 예약하고, 운영 반영과 사후 확인이 끝난 뒤 견적 이하로 한 번만 차감합니다. 실패한 배포는 원본 유지 또는 자동 복원이 확인되면 예약을 해제합니다. 결과 불명일 때는 예약을 유지합니다.</p></div></section>`}
function settings(){return head('설정','개인 정보와 본인 확인 수단을 관리합니다.')+`<section class="panel"><h2>패스키와 보안</h2><div class="row"><div><p class="row-title">패스키</p><p>${hasPasskey?'등록 완료 · 화면 검토용 상태':'운영 반영 전 본인 확인을 위해 등록이 필요합니다.'}</p></div>${btn(hasPasskey?'등록 정보 확인':'패스키 등록 안내','register-passkey',true)}</div><div class="row"><div><p class="row-title">패스키를 사용할 수 없나요?</p><p>다른 등록 기기의 패스키로 인증하거나 계정 복구 절차를 확인하세요.</p></div>${btn('복구 안내','recover-passkey')}</div><div class="row"><div><p class="row-title">데이터 보존·삭제</p><p>삭제 범위와 진행 중인 반영·복원 작업을 먼저 확인합니다.</p></div>${btn('삭제 요청 안내','delete-info')}</div></section>`}
function support(){return head('문의','새 문의에는 현재 사이트와 작업 맥락을 함께 확인합니다.')+`<section class="panel"><h2>새 문의 작성</h2><form class="form" id="support-form"><div class="notice">첨부 맥락: blue-dental.example · ${sample==='unknown'?'반영 결과 확인 중':'현재 작업 DEMO-001'}<p class="meta">계정 토큰이나 민감 정보는 전송하지 않습니다.</p></div><label class="field">제목 (필수)<input id="support-title" minlength="5" maxlength="120" required placeholder="문의 내용을 짧게 적어 주세요"></label><label class="field">내용 (필수)<input id="support-body" minlength="10" maxlength="5000" required placeholder="문제가 발생한 상황을 적어 주세요"></label><div class="check"><input type="checkbox" id="attach" required><label for="attach">사이트·작업 맥락을 확인했습니다. 이 시연에서는 실제 전송하지 않습니다.</label></div><div><button class="btn primary" type="submit">접수 화면 확인</button></div></form></section>`}
function studio(){return head('변경안 만들기','Studio 진입부터 승인까지의 순서를 확인하는 시연입니다.')+`<section class="panel"><p class="status-line">blue-dental.example · 요소 1개 · 운영 반영 전</p><h2>메인 배너 제목</h2><div class="form"><div class="notice">현재 문구: 가을 스케일링 이벤트</div><label class="field">바꿀 내용<input id="instruction" value="10월 스케일링 안내" maxlength="120"></label><p class="muted">실제 Studio에서는 요소를 고른 뒤 말하거나 입력합니다. 마이크 권한 거부·인식 실패 시에도 직접 입력할 수 있습니다.</p><div class="notice"><b>${requestConfirmed?'요청 확인됨 · 최대 비용 2C':'요청과 최대 비용 확인'}</b><p>${previewed?'미리보기 준비 · 자동 검사 통과 · 2C 예약 중':'변경 내용을 먼저 확인합니다. 미리보기를 요청하면 최대 2C를 예약하며, 이 단계에서는 확정 차감하지 않습니다.'}</p></div></div><div class="inline-actions">${!requestConfirmed?btn('요청·최대 비용 확인','confirm-request',true):!previewed?btn('미리보기 만들기','preview',true):btn('반영 전 최종 확인','approve',true)}${btn('홈으로','home')}</div></section>`}
function flow(){const rows=[['홈과 연결','C01 · C07','지원 환경 확인 → 소유·관리 권한 확인 → GitHub 연결 → 진단 → 테스트 수정·복원 확인. 실패하면 해당 단계에서 재개합니다.'],['선택과 요청','C13 · O11','요소 1개 선택 → 음성 또는 직접 입력 → 인식 내용·변경 범위·최대 비용 확인. 마이크 거부 시 입력 대안을 제공합니다.'],['미리보기와 검증','C13 · O14 · O16','미리보기 요청 시 HOLD → 매핑 HIGH와 자동 검사 확인. 원본 변경·검증 실패 시 반영을 막고 요청 수정·재검증으로 돌아갑니다.'],['본인 확인과 반영','O17','패스키 미등록 시 등록 안내 → 도메인·변경·최대 비용 확인 → 길게 누르기 또는 동등한 키보드 확인 → 패스키 인증 → 서버 게이트 검사.'],['결과와 비용','C15 · C19 · C20 · O22','반영됨·사후 점검 중 → 확인 완료 시 VERIFIED와 차감 확정. 결과 불명은 예약 유지·동일 작업 조회, 재반영 금지. 원본 유지·자동 복원 확인 후 예약 해제.'],['복원과 지원','C19 · O18 · C33','마지막 성공 배포 1건의 복원 조건 확인 → 인증·요청 → 복원 및 사후 점검 확인. 실패·결과 불명은 지원으로 연결하며 완료로 표시하지 않습니다.']];return head('사용자 프로세스','화면 ID는 유지하고 통합 화면 안에서 단계와 상태로 연결합니다.')+`<section class="panel"><h2>첫 연결부터 반영·복원까지</h2><div class="flow-list">${rows.map((r,i)=>`<div class="flow-row"><span class="step-num">${i+1}</span><div><b>${r[0]}</b><div class="meta">${r[1]}</div></div><p>${r[2]}</p></div>`).join('')}</div><div class="note">${svg('shield')}<p>작업·반영·문의 메뉴는 리소스 ID 없이 목록부터 열립니다. 상세 선택 후 ID를 주소에 반영하고, 뒤로 가면 필터와 선택 맥락을 유지합니다. 팀·별도 승인함·파트너·추가 구매·플랜 변경은 현재 메뉴에서 제외합니다.</p></div></section>`}
function render(focus=false){$('#nav').innerHTML=menus.map(([id,label,icon])=>`<button data-action="${id}" ${view===id?'aria-current="page"':''}>${svg(icon)}${label}</button>`).join('');$('#breadcrumb').textContent=menus.find(m=>m[0]===view)?.[1]||({flow:'사용자 프로세스',studio:'Studio · 흐름 시연'}[view]);$('#content').innerHTML=({home,connection,jobs,deployments,credits,support,settings,flow,studio}[view]||home)()+review();if(focus)$('#content').focus({preventScroll:true})}
function go(next){view=next;history.replaceState(null,'','#'+next);render(true);window.scrollTo(0,0)}
function modal(title,body,actions){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;$('#dialog-actions').innerHTML=actions||btn('닫기','close');$('#dialog').showModal()}
function act(a){if(a==='close')return $('#dialog').close();if(a==='connect-next'){if(connectStep===0){if(!$('#site-url').checkValidity()||!$('#ownership').checked){$('#form-error').textContent='올바른 사이트 주소와 소유·관리 권한 확인이 필요합니다.';return}}connectStep=Math.min(4,connectStep+1);if(connectStep===4)sample='ready';return render()}if(a==='connect-back'){connectStep=Math.max(0,connectStep-1);return render()}if(a==='confirm-request'){requestConfirmed=true;return render()}if(a==='preview'){previewed=true;return render()}if(a==='approve'){if(!hasPasskey)return modal('패스키 등록이 필요합니다','<p>첫 운영 반영 전에 패스키를 등록합니다. 변경안과 예약 상태는 유지하고 설정으로 이동합니다.</p>',btn('변경안으로 돌아가기','close')+btn('패스키 설정','passkey-settings',true));return modal('운영 반영 전 최종 확인','<p><b>blue-dental.example · 운영</b></p><p>제목을 “10월 스케일링 안내”로 변경 · 최대 2C</p><p>실제 서비스에서는 1초 길게 누르기 또는 동등한 접근성 확인 뒤 패스키와 서버 검사를 거칩니다. 이 화면은 실제 인증·반영을 실행하지 않습니다.</p>',btn('취소','close')+btn('확인 후 패스키 단계 시연','simulate-auth',true))}if(a==='passkey-settings'){$('#dialog').close();go('settings');return}if(a==='register-passkey')return modal('패스키 등록 안내','<p>본인 확인 후 기기 또는 비밀번호 관리자에 패스키를 등록합니다. 실제 등록 API는 연결하지 않았습니다.</p>',btn('취소','close')+btn('등록 완료 상태로 보기','passkey-done',true));if(a==='passkey-done'){hasPasskey=true;$('#dialog').close();go(previewed?'studio':'settings');return}if(a==='simulate-auth'){$('#dialog').close();sample='unknown';return go('deployments')}if(a==='reconcile')return modal('현재 작업을 다시 조회합니다','<p>DEMO-001의 반영·사후 점검 결과를 조회하는 단계입니다. 이 검토본에는 서버가 연결되지 않아 실제 결과를 확정할 수 없습니다. 예약 2C는 유지됩니다.</p>');if(a==='rollback')return modal('복원 조건 확인','<p>대상: 마지막 성공 배포 1건</p><p>보존 기간·스냅샷·현재 원본·후속 변경을 서버에서 확인한 뒤 복원 요청을 허용합니다. 현재 검토본에서는 실제 실행을 제공하지 않습니다.</p><p>정상 반영 후 변심으로 복원해도 원래 차감은 유지됩니다. 복원·사후 확인 전에는 완료로 표시하지 않습니다.</p>');if(a==='recover-passkey')return modal('패스키를 사용할 수 없을 때','<p>다른 등록 기기로 인증할 수 있는지 먼저 확인합니다. 사용할 수 있는 패스키가 없으면 계정 복구 절차로 연결하고 복구가 확인되기 전에는 운영 반영을 차단합니다.</p><p>본인 확인 방식·대기 기간·운영 검토 조건은 별도 확정이 필요합니다. 이메일만으로 반영 권한을 우회하지 않습니다.</p>',btn('닫기','close')+btn('복구 문의 작성','recovery-support',true));if(a==='recovery-support'){$('#dialog').close();go('support');return}if(a==='delete-info')return modal('데이터 삭제 요청','<p>계정·사이트·작업 데이터 중 삭제 범위를 구분합니다. 진행 중인 반영·복원과 법적 보존 의무를 확인한 뒤 재인증을 거쳐 요청합니다. 즉시 삭제 완료로 표시하지 않습니다.</p>');if(['home','connection','jobs','deployments','credits','support','settings','flow','studio'].includes(a)){if(a==='studio'&&(sample==='empty'||sample==='connecting'))return go('connection');if(a==='studio'&&sample==='unknown')return go('deployments');return go(a)}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-theme-value]');if(t)return theme(t.dataset.themeValue);const a=e.target.closest('[data-action]');if(a)act(a.dataset.action)});document.addEventListener('change',e=>{if(e.target.id==='sample'){sample=e.target.value;hasPasskey=false;requestConfirmed=false;previewed=false;connectStep=sample==='connecting'?1:0;go('home')}});document.addEventListener('submit',e=>{if(e.target.id==='support-form'){e.preventDefault();modal('문의 접수 화면 · 시연','<p>실제 문의는 전송하지 않았습니다. 서비스에서는 접수 성공 후 발급된 문의 ID로 상세 대화를 열고, 전송 실패 시 작성 내용을 유지합니다.</p>')}});
if(location.hash&&['home','connection','jobs','deployments','credits','support','settings','flow','studio'].includes(location.hash.slice(1)))view=location.hash.slice(1);render();
</script>
</body></html>
